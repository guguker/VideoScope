[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "videoscope-backend"
version = "0.1.0"
description = "Local multimodal video search and clip export backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "huggingface-hub>=0.28,<2",
  "qdrant-client[fastembed]>=1.13,<2",
  "fastembed==0.8.0",
  "scenedetect[opencv]>=0.6.6,<0.7",
  "opencv-python>=4.12.0.88,<5",
  "pillow>=11,<13",
  "numpy>=1.26,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "torch>=2.6,<3",
  "uv==0.12.3",
]
video = [
  "mlx-vlm==0.6.10",
]

[project.scripts]
videoscope = "videoscope.__main__:main"
videoscope-benchmark = "videoscope.benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/videoscope"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["videoscope"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
