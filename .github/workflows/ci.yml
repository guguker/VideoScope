name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated files and non-portable links
        run: |
          bash scripts/check-repository-hygiene.sh
          bash scripts/test-repository-hygiene.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install locked backend
        run: uv sync --project backend --locked --extra dev
      - name: Check dependency consistency
        run: uv pip check --python backend/.venv/bin/python
      - name: Test backend
        run: backend/.venv/bin/python -m pytest backend/tests --cov=videoscope --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Test frontend
        run: pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build
      - name: Verify build did not modify tracked files
        run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm --dir frontend e2e
