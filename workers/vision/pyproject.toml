[project]
name = "videoscope-vision-worker"
version = "0.1.0"
description = "Isolated offline SigLIP 2 and RF-DETR runtime for VideoScope"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "huggingface-hub==1.27.0",
  "numpy==2.5.1",
  "opencv-python==4.14.0.94",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "rfdetr==1.7.1",
  "supervision==0.28.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.14.1",
  "uvicorn[standard]==0.52.1",
]

[tool.uv]
package = false
exclude-newer = "2026-08-18T00:00:00Z"
